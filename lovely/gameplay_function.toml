[manifest]
version = "1.0.0"
dump_lua = true
priority = 0


[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if v.yes_pool_flag and not G.GAME.pool_flags[v.yes_pool_flag] then add = nil end"
position = "after"
payload = '''
if v.set == 'Voucher' and v.name == "Magic Trick" then add = nil end
if v.set == 'Voucher' and v.name == "Illusion" then add = nil end
'''
match_indent = true